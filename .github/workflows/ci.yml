name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (e.g. v1.2.3). Leave empty for a plain build."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

permissions:
  contents: read
  packages: write

jobs:
  pre-checks:
    name: Pre checks (Go + web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vod
          POSTGRES_PASSWORD: vod
          POSTGRES_DB: vod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vod"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: vod
          MINIO_ROOT_PASSWORD: vod-vod-vod
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Vet
        run: go vet ./...
      - name: "Test (integration: Postgres + MinIO + real transcode pipeline)"
        run: go test ./...
        env:
          DATABASE_URL: postgres://vod:vod@localhost:5432/vod
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: ci-test
          S3_ACCESS_KEY: vod
          S3_SECRET_KEY: vod-vod-vod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install
        run: npm ci
        working-directory: web
      - name: Web lint
        run: npm run lint
        working-directory: web
      - name: Web tests
        run: npm test
        working-directory: web
      - name: Web build (static export, as in the Docker image)
        run: npm run build
        working-directory: web
        env:
          NEXT_OUTPUT: export

  security:
    name: Security scan
    needs: pre-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gosec (Go static analysis)
        uses: securego/gosec-action@v2
        with:
          args: -severity=medium -confidence=medium ./...
      - name: govulncheck (Go dependencies)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (web dependencies)
        run: |
          npm ci
          npm audit --audit-level=high
        working-directory: web

  docker-build:
    name: Build image (${{ matrix.platform }})
    needs: security
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save digest
        run: echo "${{ steps.build.outputs.digest }}" > digest.txt
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: digest.txt

  trivy:
    name: Image vulnerability scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan amd64 image (same Dockerfile for both platforms)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-amd64
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  merge:
    name: Publish multi-arch manifest
    needs: [docker-build, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - name: Create multi-arch manifest
        run: |
          AMD64=$(cat digests/digest-amd64/digest.txt)
          ARM64=$(cat digests/digest-arm64/digest.txt)
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ARGS="-t $IMG:latest -t $IMG:sha-${{ github.sha }}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            ARGS="$ARGS -t $IMG:${{ inputs.release_tag }}"
          fi
          docker buildx imagetools create $ARGS "$IMG@$AMD64" "$IMG@$ARM64"
          echo "Published: $IMG (amd64 + arm64)"

  release:
    name: GitHub Release (binaries)
    needs: [docker-build, trivy]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Build the release binaries (full app with the embedded UI) — the
      # web export is generated in this workflow run.
      - name: Build web export
        run: npm ci && npm run build
        working-directory: web
        env:
          NEXT_OUTPUT: export
      - name: Embed UI + build binaries
        run: |
          cp -r web/out/. internal/ui/web/out/
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/vod-app-linux-amd64 ./cmd/vod-app
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/vod-app-linux-arm64 ./cmd/vod-app
          cd dist
          sha256sum vod-app-linux-amd64 vod-app-linux-arm64 > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/vod-app-linux-amd64
            dist/vod-app-linux-arm64
            dist/checksums.txt
