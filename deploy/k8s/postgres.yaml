# Postgres StatefulSet for the in-cluster database (single replica is
# sufficient for the Vidsilo catalog; use an external DB for larger HA).
apiVersion: v1
kind: Service
metadata:
  name: vidsilo-postgres
  labels:
    app: vidsilo-postgres
spec:
  clusterIP: None
  selector:
    app: vidsilo-postgres
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vidsilo-postgres
  labels:
    app: vidsilo-postgres
spec:
  serviceName: vidsilo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: vidsilo-postgres
  template:
    metadata:
      labels:
        app: vidsilo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: vidsilo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidsilo-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: vidsilo
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vidsilo"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
