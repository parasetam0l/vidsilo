# Transcode worker: consumes the queue from the same Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidsilo-worker
  labels:
    app: vidsilo-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vidsilo-worker
  template:
    metadata:
      labels:
        app: vidsilo-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/parasetam0l/vidsilo:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/vidsilo", "worker"]
          envFrom:
            - configMapRef:
                name: vidsilo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vidsilo-secrets
                  key: database-url
            - name: TLS_CERT_DIR
              value: /data/certs
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vidsilo-media
