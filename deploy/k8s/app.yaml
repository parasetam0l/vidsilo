# App server: API + UI + media. Media storage is either an in-cluster PVC
# (local) or S3 — see the STORAGE_DRIVER / S3_* entries in the ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: vidsilo
  labels:
    app: vidsilo
spec:
  selector:
    app: vidsilo
  ports:
    - port: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidsilo
  labels:
    app: vidsilo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vidsilo
  template:
    metadata:
      labels:
        app: vidsilo
    spec:
      containers:
        - name: app
          image: ghcr.io/parasetam0l/vidsilo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: vidsilo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vidsilo-secrets
                  key: database-url
            - name: TLS_CERT_DIR
              value: /data/certs
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vidsilo-media
