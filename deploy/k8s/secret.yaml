# Secrets for the app/worker/postgres deployments. Replace the placeholders
# (base64) — e.g. via install.sh PATH D or:
#   kubectl create secret generic vidsilo-secrets \
#     --from-literal=db-password=$(openssl rand -hex 24) \
#     --from-literal=database-url=postgres://vidsilo:<pw>@vidsilo-postgres:5432/vidsilo
apiVersion: v1
kind: Secret
metadata:
  name: vidsilo-secrets
  labels:
    app: vidsilo
type: Opaque
stringData:
  db-password: CHANGE_ME
  database-url: postgres://vidsilo:CHANGE_ME@vidsilo-postgres:5432/vidsilo
  # S3_ACCESS_KEY: CHANGE_ME
  # S3_SECRET_KEY: CHANGE_ME
