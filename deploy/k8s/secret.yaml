# Secrets for the app/worker/postgres deployments. Replace the placeholders
# (base64) — e.g. via install.sh PATH D or:
#   kubectl create secret generic vod-secrets \
#     --from-literal=db-password=$(openssl rand -hex 24) \
#     --from-literal=database-url=postgres://vod:<pw>@vod-postgres:5432/vod
apiVersion: v1
kind: Secret
metadata:
  name: vod-secrets
  labels:
    app: vod
type: Opaque
stringData:
  db-password: CHANGE_ME
  database-url: postgres://vod:CHANGE_ME@vod-postgres:5432/vod
  # S3_ACCESS_KEY: CHANGE_ME
  # S3_SECRET_KEY: CHANGE_ME
