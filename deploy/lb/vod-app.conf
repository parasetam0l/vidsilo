# VOD load balancer — nginx pass-through. TLS stays at the app nodes
# (autocert/self-signed/files per node), so this proxy forwards both 80
# (ACME HTTP-01 challenges + the HTTP->HTTPS redirect) and 443 untouched.
# The app reads the real client IP from X-Forwarded-For — set TRUSTED_PROXIES
# to this node's IP on every app node.
upstream vod_apps {
    # Replace with your app node addresses (installed by install.sh PATH C):
    # server 10.0.0.11:80 max_fails=3 fail_timeout=30s;
    # server 10.0.0.12:80 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:80 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://vod_apps;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443;
    listen [::]:443;
    server_name _;

    location / {
        proxy_pass http://vod_apps;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
