# Docker deployment for vidsilo. Copy .env.example to .env and adjust.
# Production notes:
#   - Postgres is NOT published to the host; only the app port(s) are exposed.
#   - Set a strong POSTGRES_PASSWORD in .env.
#   - The worker is memory-capped so an ffmpeg burst cannot OOM the host;
#     restart: unless-stopped brings it (and the app) back automatically.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vidsilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidsilo}
      POSTGRES_DB: vidsilo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidsilo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [vidsilo]

  app:
    image: ghcr.io/parasetam0l/vidsilo
    build: .
    environment:
      DATABASE_URL: postgres://vidsilo:${POSTGRES_PASSWORD:-vidsilo}@db:5432/vidsilo
      DATA_DIR: /data
      STORAGE_DRIVER: local
      # HTTP/HTTPS listeners (host ports published below; override via .env):
      #   PUBLIC_HTTP_PORT  -> HTTP_PORT   (default 80 -> 8080)
      #   PUBLIC_HTTPS_PORT -> HTTPS_PORT  (default 443 -> 8443)
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      # TLS (all optional; TLS_MODE=off by default):
      #   letsencrypt: HTTPS via autocert — set TLS_DOMAINS + open 80/443
      #   selfsigned:  HTTPS with a locally generated cert (no DNS needed)
      #   files:       HTTPS with TLS_CERT_FILE/TLS_KEY_FILE (self-signed fallback)
      # TLS_CERT_FILE/TLS_KEY_FILE paths must be mounted (see certs volume below).
      TLS_MODE: ${TLS_MODE:-off}
      TLS_DOMAINS: ${TLS_DOMAINS:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - media:/data
      # Optional: mount your own certs when TLS_MODE=files:
      # - ./certs/server.pem:/certs/server.pem:ro
      # - ./certs/server-key.pem:/certs/server-key.pem:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:${HTTP_PORT:-8080}"
      - "${PUBLIC_HTTPS_PORT:-443}:${HTTPS_PORT:-8443}"
      # The HTTP listener serves ACME challenges + the HTTP->HTTPS redirect
      # in TLS modes. Harmless when TLS_MODE=off.
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1}
    restart: unless-stopped
    networks: [vidsilo]

  worker:
    image: ghcr.io/parasetam0l/vidsilo
    build: .
    command: ["worker"]
    # The worker is a queue consumer with no HTTP listener; the Dockerfile
    # HEALTHCHECK only applies to the server role.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://vidsilo:${POSTGRES_PASSWORD:-vidsilo}@db:5432/vidsilo
      DATA_DIR: /data
      STORAGE_DRIVER: local
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy
    # Transcoding is the memory-heavy path: cap it so ffmpeg can never OOM
    # the host. If the limit is hit the kernel kills the transcode process,
    # the job fails and is retryable.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${WORKER_MEM_LIMIT:-4g}
    cpus: ${WORKER_CPUS:-2}
    restart: unless-stopped
    networks: [vidsilo]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vidsilo
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vidsilo-secret}
    volumes:
      - minio-data:/data
    profiles: [s3]
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks: [vidsilo]

volumes:
  pgdata:
  media:
  minio-data:

networks:
  vidsilo:
